[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crassist"
version = "0.1.0"
description = "AI-powered code review assistant: static analysis + LLM review, LoRA fine-tuning, GitHub PR integration, quality dashboard"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "fastapi>=0.110", "uvicorn>=0.27"]

[project.optional-dependencies]
train = ["torch>=2.1", "transformers>=4.40", "peft>=0.10", "accelerate>=0.27", "bitsandbytes>=0.43; platform_system == 'Linux'"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
crassist = "crassist.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crassist = ["static/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
